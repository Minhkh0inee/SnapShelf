name: iOS CI - Code Quality & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-build:
    name: Lint & Build Test
    runs-on: macos-26   # image cần có Xcode 27

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'   # nếu là beta, thử '27.0-beta'

      - name: Show Xcode Info
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          xcodebuild build \
            -project SnapShelf.xcodeproj \
            -scheme SnapShelf \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO