name: iOS CI - Code Quality & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-build:
    name: Lint & Build Test
    runs-on: macos-14  # Runner chạy macOS trên GitHub Actions

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run SwiftLint (Kiểm tra chất lượng & format code)
        run: |
          if which swiftlint >/dev/null; then
            swiftlint lint --strict
          else
            echo "SwiftLint không có sẵn, tiến hành cài đặt..."
            brew install swiftlint
            swiftlint lint --strict
          fi

      - name: Build Xcode Project
        run: |
          xcodebuild build \
            -project SnapShelf.xcodeproj \
            -scheme SnapShelf \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO